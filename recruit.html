  "description": "<p>【未経験の方へ ― まずは、ここから読んでください】<br>「警備の仕事は大変そう」「自分にできるか不安」――そう感じている方こそ歓迎します。株式会社アクティブでは、入社されたスタッフのほとんどが未経験からのスタートです。3日間の法定研修（時給1,100円×20時間＝22,000円を支給）で基礎からじっくり学び、実際の現場でも先輩スタッフが必ずそばでフォローします。いきなり一人で任されることはありませんので、安心してください。</p><p>【職種】<br>警備スタッフ（交通誘導警備・施設警備・駐車場警備・イベント警備）。工事現場での車両や歩行者の交通誘導、施設・駐車場の巡回や監視、イベント会場での雑踏警備など、地域の安全とあなたの街の毎日を支える仕事です。</p><p>【勤務地】<br>奈良県奈良市（大宮町二丁目・本社）を拠点に、奈良県全域の現場を中心として、大阪府・京都府の現場もあります。「自宅から近い現場がいい」「土日だけ」「平日のみ」など、勤務地や働き方はあなたの希望に合わせて柔軟に選べます。</p><p>【給与】<br>時給1,100円〜（研修中も同時給）。週2日勤務で推定月収9万円〜、週5日勤務で推定月収21万円〜。さらに新人応援金として5,000円×最大10回（合計50,000円）を支給します。各種手当・日給保証制度あり。日払い・週払いにも対応しているため「すぐに収入が必要」という方も安心して働けます。</p><p>【勤務時間】<br>日勤 8:00〜17:00 ／ 夜勤 21:00〜翌6:00（実働8時間・休憩あり）。1週間ごとの自己申告シフト制で、週2日〜勤務OK。Wワークや扶養内での勤務のご相談も歓迎します。</p><p>【応募資格】<br>18歳以上の方（警備業法による／高校生不可）。資格・経験は一切不問です。学歴やブランクも問いません。18歳から70代まで、幅広い年代のスタッフが活躍中で、女性スタッフも安心して働いています。</p><p>【安心して長く働ける環境】<br>・未経験でも安心の研修制度と、先輩による丁寧なフォロー体制<br>・困ったときにすぐ相談できる、声を掛け合える明るいチーム<br>・空調服や防寒具の支給、こまめな休憩で身体の負担を軽減<br>・社会保険完備。頑張った分がしっかり還元される待遇<br>・希望休や勤務日数の相談に柔軟に対応</p><p>【選考について】<br>面接は基本的に応募者全員に行います。ほとんどの場合は即日中に合否をお伝えし、合格された方には3営業日以内にご連絡します。まずはお気軽にご応募ください。</p>",
